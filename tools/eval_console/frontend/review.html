<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO Eval — Review</title>
  <style>
    /* ── Reset & Variables ─────────────────────────────────────── */
    :root {
      --primary: #2563eb; --primary-h: #1d4ed8;
      --success: #16a34a; --warning: #d97706; --danger: #dc2626;
      --info: #0891b2;
      --bg: #f1f5f9; --card-bg: #fff; --ref-bg: #f8fafc;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      --header-h: 58px; --sidebar-w: 270px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           font-size: 14px; color: var(--text); background: var(--bg);
           height: 100vh; overflow: hidden; }

    /* ── Layout ────────────────────────────────────────────────── */
    .app { display: grid;
           grid-template-areas: "hdr hdr" "sidebar main";
           grid-template-rows: var(--header-h) 1fr;
           grid-template-columns: var(--sidebar-w) 1fr;
           height: 100vh; }

    /* ── Header ────────────────────────────────────────────────── */
    .app-header {
      grid-area: hdr; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .app-logo { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .progress-wrap { display: flex; align-items: center; gap: 10px; }
    .progress-track {
      width: 160px; height: 6px; background: rgba(255,255,255,0.3);
      border-radius: 3px; overflow: hidden;
    }
    .progress-fill { height: 100%; background: #86efac; border-radius: 3px; transition: width 0.4s; }
    .progress-label { font-size: 13px; opacity: 0.9; white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
    .reviewer-badge {
      background: rgba(255,255,255,0.15); border-radius: 20px;
      padding: 4px 12px; font-weight: 600;
    }
    .btn-logout {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 5px 14px; border-radius: 6px;
      cursor: pointer; font-size: 13px; transition: background 0.15s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    /* ── Sidebar ───────────────────────────────────────────────── */
    .app-sidebar {
      grid-area: sidebar; background: var(--card-bg);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-top { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .jump-input {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; outline: none;
    }
    .jump-input:focus { border-color: var(--primary); }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-select {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 12px; background: var(--bg); outline: none; cursor: pointer;
    }
    .filter-check { font-size: 12px; display: flex; align-items: center; gap: 4px;
                    cursor: pointer; color: var(--muted); white-space: nowrap; }
    .query-list { flex: 1; overflow-y: auto; }
    .query-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; border-bottom: 1px solid #f1f5f9;
      cursor: pointer; transition: background 0.1s; font-size: 13px;
    }
    .query-item:hover { background: #f8fafc; }
    .query-item.active { background: #eff6ff; border-left: 3px solid var(--primary); padding-left: 9px; }
    .qi-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .qi-complete { background: var(--success); }
    .qi-partial { background: var(--warning); }
    .qi-unrated { background: #cbd5e1; }
    .qi-flagged { background: var(--danger); }
    .qi-id { font-weight: 600; color: var(--primary); flex-shrink: 0; }
    .qi-meta { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    .qi-lang { font-size: 11px; background: #e0e7ff; color: #4338ca;
               border-radius: 4px; padding: 1px 5px; flex-shrink: 0; }

    /* ── Main Content ──────────────────────────────────────────── */
    .app-main { grid-area: main; overflow-y: auto; padding: 20px 24px 40px; }
    .loading-state, .error-state {
      text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px;
    }
    .error-state { color: var(--danger); }

    /* ── Card ──────────────────────────────────────────────────── */
    .card { background: var(--card-bg); border-radius: 12px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.07); overflow: hidden; }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: #f8fafc;
      border-bottom: 1px solid var(--border); gap: 10px; flex-wrap: wrap;
    }
    .card-header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .query-id { font-size: 16px; font-weight: 800; color: var(--text); }
    .position-label { font-size: 13px; color: var(--muted); white-space: nowrap; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px;
             border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-lang { background: #e0e7ff; color: #4338ca; }
    .badge-topic { background: #f0fdf4; color: #15803d; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-info { background: #e0f2fe; color: #0369a1; }

    /* Conversation history */
    .conv-history { margin: 16px 20px 0; }
    .conv-history > summary {
      font-size: 13px; font-weight: 600; color: var(--primary); cursor: pointer;
      padding: 8px 0; user-select: none; list-style: none;
    }
    .conv-history > summary::before { content: '▶ '; font-size: 10px; }
    .conv-history[open] > summary::before { content: '▼ '; }
    .chat-thread { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
    .chat-bubble {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5;
    }
    .bubble-user { background: #eff6ff; }
    .bubble-bot { background: #f8fafc; }
    .bubble-icon { font-size: 16px; flex-shrink: 0; }
    .bubble-text { color: var(--text); }

    /* Sections */
    .section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .query-section { background: #fffbf0; }
    .turn5-query-section { background: #fff7ed; border-left: 3px solid var(--warning); margin: 12px 20px 0; padding: 12px 16px; border-radius: 6px; }
    .section-label { font-size: 11px; font-weight: 700; color: var(--muted);
                     text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .query-text { font-size: 15px; line-height: 1.65; font-weight: 500; }

    /* Reference panel */
    .reference-panel {
      margin: 16px 20px; padding: 14px 16px;
      background: var(--ref-bg); border: 1px solid var(--border);
      border-radius: 8px; border-left: 3px solid var(--primary);
    }
    .reference-panel-sm { margin: 12px 0; }
    .reference-body { font-size: 13px; line-height: 1.6; color: var(--text); }
    .reference-body p { margin-bottom: 6px; }
    .gold-refs { margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .gold-refs-label { font-size: 11px; font-weight: 700; color: var(--muted);
                       text-transform: uppercase; }
    .article-tag {
      background: #dbeafe; color: #1e40af; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 600;
    }

    /* Answers grid */
    .answers-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--border); margin: 0;
    }
    .answer-col { background: var(--card-bg); display: flex; flex-direction: column; }
    .answer-col-header {
      padding: 10px 14px; font-size: 13px; font-weight: 700;
      background: #f8fafc; border-bottom: 1px solid var(--border);
      color: var(--primary); letter-spacing: 0.02em;
    }
    .answer-body { flex: 1; padding: 14px; border-bottom: 1px solid var(--border); }
    .answer-content { font-size: 13px; line-height: 1.65; max-height: 360px; overflow-y: auto; }
    .answer-content p { margin-bottom: 8px; }
    .answer-content ul, .answer-content ol { padding-left: 18px; margin-bottom: 8px; }
    .answer-content li { margin-bottom: 4px; }
    .no-turn6-msg { color: var(--muted); font-style: italic; font-size: 13px; }

    /* Rating block */
    .rating-block { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .scale-hint { font-weight: 400; font-size: 11px; color: #94a3b8; margin-left: 4px; }
    .pill-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; position: relative;
      padding: 5px 13px; border: 1.5px solid var(--border);
      border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600;
      background: #f8fafc; color: var(--muted); transition: all 0.12s;
      user-select: none;
    }
    .pill:hover { border-color: #93c5fd; color: var(--primary); }
    .pill input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .pill:has(input:checked) { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pill-success:has(input:checked) { background: var(--success); border-color: var(--success); }
    .pill-danger:has(input:checked) { background: var(--danger); border-color: var(--danger); }
    .pill-muted:has(input:checked) { background: #64748b; border-color: #64748b; }
    textarea {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 12px; font-family: inherit;
      resize: vertical; outline: none; transition: border-color 0.15s;
      color: var(--text); line-height: 1.5;
    }
    textarea:focus { border-color: var(--primary); }
    .save-status { font-size: 11px; min-height: 14px; transition: opacity 0.3s; }
    .save-status-saving { color: var(--muted); }
    .save-status-saved { color: var(--success); }
    .save-status-error { color: var(--danger); }

    /* Turn6 block */
    .turn6-block {
      margin: 0; border-top: 2px solid var(--warning); background: #fffbf0;
    }
    .turn6-header {
      padding: 12px 20px; font-size: 13px; font-weight: 700;
      color: var(--warning); text-transform: uppercase; letter-spacing: 0.06em;
    }

    /* Navigation */
    .card-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-top: 1px solid var(--border); gap: 10px;
    }
    .btn {
      padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-prev { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-prev:hover:not(:disabled) { background: var(--border); }
    .btn-next { background: var(--primary); color: #fff; }
    .btn-next:hover:not(:disabled) { background: var(--primary-h); }
    .btn-flag { background: #fff7ed; color: var(--warning); border: 1px solid #fed7aa; }
    .btn-flag:hover { background: #ffedd5; }
    .btn-flag.flagged { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-logo">LEO Eval</span>
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <span class="progress-label" id="progress-label">Loading…</span>
      </div>
    </div>
    <div class="header-right">
      <span class="reviewer-badge" id="reviewer-badge">—</span>
      <button class="btn-logout" onclick="REVIEW.logout()">Logout</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="app-sidebar">
    <div class="sidebar-top">
      <input class="jump-input" type="text" id="jump-input"
             placeholder="Jump to query ID (e.g. Q036)…"
             onkeydown="if(event.key==='Enter') REVIEW.jumpToQuery(this.value.trim())">
      <div class="filter-row">
        <select class="filter-select" id="filter-topic" onchange="REVIEW.applyFilters()">
          <option value="">All Topics</option>
        </select>
        <select class="filter-select" id="filter-lang" onchange="REVIEW.applyFilters()">
          <option value="">All Languages</option>
          <option value="en">English</option>
          <option value="fil">Filipino</option>
          <option value="ceb">Cebuano</option>
        </select>
        <select class="filter-select" id="filter-status" onchange="REVIEW.applyFilters()">
          <option value="">All</option>
          <option value="complete">Complete</option>
          <option value="partial">Partial</option>
          <option value="unrated">Unrated</option>
          <option value="flagged">Flagged</option>
        </select>
      </div>
      <label class="filter-check">
        <input type="checkbox" id="filter-ambiguous" onchange="REVIEW.applyFilters()">
        Ambiguous only
      </label>
    </div>
    <div class="query-list" id="query-list"></div>
  </aside>

  <!-- Main -->
  <main class="app-main">
    <div class="loading-state" id="card-loading">Loading evaluation data…</div>
    <div class="error-state" id="card-error" style="display:none"></div>
    <form id="eval-form" autocomplete="off">
      <div id="card-container"></div>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/state.js"></script>
<script src="/js/card.js"></script>
<script>
'use strict';

const REVIEW = (() => {
  let _queryList = [];          // full list from server
  let _filteredList = [];       // after filters applied
  let _currentQueryId = null;
  let _currentQuery = null;     // full card data

  // ── Bootstrap ────────────────────────────────────────────────────

  async function init() {
    const token = localStorage.getItem('leo_eval_token');
    const reviewerId = localStorage.getItem('leo_eval_reviewer_id');
    if (!token || !reviewerId) { window.location.href = '/'; return; }

    STATE.init();
    document.getElementById('reviewer-badge').textContent =
      reviewerId === 'reviewer_1' ? 'Reviewer 1' : 'Reviewer 2';

    try {
      // Parallel fetch: query list + existing ratings
      const [queries, ratings] = await Promise.all([
        API.get('/api/queries'),
        API.get(`/api/ratings/${reviewerId}`),
      ]);
      if (!queries) return; // 401 redirect handled

      _queryList = queries;
      STATE.setServerRatings(ratings || []);

      // Populate topic filter
      const topics = [...new Set(queries.map(q => q.topic))].sort();
      const sel = document.getElementById('filter-topic');
      topics.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t.replace(/_/g, ' ');
        sel.appendChild(opt);
      });

      _filteredList = [..._queryList];
      renderQueryList();
      updateProgress();

      // Resume from saved position
      const savedIdx = STATE.getQueryIndex();
      const startIdx = Math.min(savedIdx, _queryList.length - 1);
      await _loadCard(_queryList[startIdx]?.query_id);
    } catch (err) {
      _showError('Failed to load evaluation data: ' + err.message);
    }
  }

  // ── Navigation ───────────────────────────────────────────────────

  async function _loadCard(queryId) {
    if (!queryId) return;
    document.getElementById('card-loading').style.display = 'block';
    document.getElementById('card-container').innerHTML = '';
    document.getElementById('card-error').style.display = 'none';

    try {
      const query = await API.get(`/api/queries/${queryId}`);
      if (!query) return;
      _currentQueryId = queryId;
      _currentQuery = query;

      // Record current position
      const idx = _queryList.findIndex(q => q.query_id === queryId);
      if (idx >= 0) STATE.setQueryIndex(idx);

      document.getElementById('card-loading').style.display = 'none';
      CARD.render(query, _onRatingSaved);
      _highlightSidebarItem(queryId);
    } catch (err) {
      _showError('Failed to load card: ' + err.message);
    }
  }

  async function navigatePrev() {
    if (!_currentQueryId) return;
    const query = await API.get(`/api/queries/${_currentQueryId}`);
    if (query?.prev_query_id) await _loadCard(query.prev_query_id);
  }

  async function navigateNext() {
    if (!_currentQueryId) return;
    const query = await API.get(`/api/queries/${_currentQueryId}`);
    if (query?.next_query_id) await _loadCard(query.next_query_id);
  }

  async function saveAndContinue() {
    if (!_currentQuery) return;
    await CARD.saveAll(_currentQuery);
    updateProgress();
    renderQueryList();
    await navigateNext();
  }

  async function flagCard() {
    if (!_currentQuery) return;
    await CARD.toggleFlag(_currentQuery);
    renderQueryList();
  }

  function jumpToQuery(raw) {
    const qid = raw.toUpperCase();
    const found = _queryList.find(q => q.query_id === qid);
    if (found) {
      _loadCard(found.query_id);
      document.getElementById('jump-input').value = '';
    }
  }

  function logout() {
    STATE.clearSession();
    window.location.href = '/';
  }

  // ── Sidebar ──────────────────────────────────────────────────────

  function renderQueryList() {
    const container = document.getElementById('query-list');
    if (!container) return;

    const html = _filteredList.map(q => {
      const evalIds = q.eval_ids || [];
      let statusCls = 'qi-unrated';
      if (STATE.isQueryFlagged(evalIds)) statusCls = 'qi-flagged';
      else if (STATE.isQueryComplete(evalIds)) statusCls = 'qi-complete';
      else if (STATE.isQueryPartial(evalIds)) statusCls = 'qi-partial';

      const activeCls = q.query_id === _currentQueryId ? 'active' : '';

      return `<div class="query-item ${activeCls}" onclick="REVIEW._loadCard('${q.query_id}')">
        <span class="qi-status ${statusCls}"></span>
        <span class="qi-id">${q.query_id}</span>
        <span class="qi-lang">${q.language}</span>
        <span class="qi-meta">${q.topic.replace(/_/g, ' ')}</span>
      </div>`;
    }).join('');

    container.innerHTML = html || '<p style="padding:12px;color:#94a3b8;font-size:13px;">No queries match filters.</p>';
  }

  function _highlightSidebarItem(queryId) {
    document.querySelectorAll('.query-item').forEach(el => el.classList.remove('active'));
    const items = document.querySelectorAll('.query-item');
    const idx = _filteredList.findIndex(q => q.query_id === queryId);
    if (idx >= 0 && items[idx]) {
      items[idx].classList.add('active');
      items[idx].scrollIntoView({ block: 'nearest' });
    }
  }

  function applyFilters() {
    const topic = document.getElementById('filter-topic').value;
    const lang = document.getElementById('filter-lang').value;
    const status = document.getElementById('filter-status').value;
    const ambigOnly = document.getElementById('filter-ambiguous').checked;

    _filteredList = _queryList.filter(q => {
      if (topic && q.topic !== topic) return false;
      if (lang && q.language !== lang) return false;
      if (ambigOnly && !q.is_ambiguous) return false;
      if (status) {
        const evalIds = q.eval_ids || [];
        const isFlagged = STATE.isQueryFlagged(evalIds);
        const isComplete = STATE.isQueryComplete(evalIds);
        const isPartial = STATE.isQueryPartial(evalIds);
        if (status === 'flagged' && !isFlagged) return false;
        if (status === 'complete' && !isComplete) return false;
        if (status === 'partial' && !isPartial) return false;
        if (status === 'unrated' && (isComplete || isPartial || isFlagged)) return false;
      }
      return true;
    });
    renderQueryList();
  }

  // ── Progress ─────────────────────────────────────────────────────

  function updateProgress() {
    const total = _queryList.reduce((s, q) => s + (q.eval_ids?.length || 0), 0);
    const done = _queryList.reduce((s, q) => {
      return s + (q.eval_ids || []).filter(id => STATE.isEvalRated(id)).length;
    }, 0);
    const pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = `${done} / ${total} rated`;
  }

  // ── Helpers ──────────────────────────────────────────────────────

  function _onRatingSaved(evalId) {
    updateProgress();
    renderQueryList();
  }

  function _showError(msg) {
    document.getElementById('card-loading').style.display = 'none';
    const el = document.getElementById('card-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  return {
    init, navigatePrev, navigateNext, saveAndContinue, flagCard,
    jumpToQuery, logout, renderQueryList, applyFilters, updateProgress,
    _loadCard,
  };
})();

document.addEventListener('DOMContentLoaded', REVIEW.init);
</script>
</body>
</html>
