<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO Eval — Admin Progress Dashboard</title>
  <style>
    :root {
      --primary: #2563eb; --success: #16a34a; --warning: #d97706;
      --danger: #dc2626; --bg: #f1f5f9; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
    .header { text-align: center; }
    .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); }
    .header p { color: var(--muted); margin-top: 4px; font-size: 13px; }
    .card { background: #fff; border-radius: 12px; padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    .login-form { display: flex; flex-direction: column; gap: 12px; }
    .pw-input {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    .pw-input:focus { border-color: var(--primary); }
    .btn {
      padding: 10px 20px; border: none; border-radius: 7px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn-success:disabled { opacity: 0.55; cursor: not-allowed; }
    .error-box {
      background: #fee2e2; color: #b91c1c; padding: 10px 14px;
      border-radius: 7px; font-size: 13px; display: none;
    }
    .reviewer-card { display: flex; flex-direction: column; gap: 8px; }
    .reviewer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .reviewer-name { font-weight: 600; font-size: 14px; }
    .reviewer-pct { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .prog-track { flex: 1; height: 10px; background: var(--bg);
                  border-radius: 5px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 5px; transition: width 0.5s; }
    .prog-fill-1 { background: var(--primary); }
    .prog-fill-2 { background: var(--success); }
    .complete-badge {
      font-size: 12px; padding: 2px 8px; border-radius: 10px;
      background: #dcfce7; color: #15803d; font-weight: 600;
    }
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    .export-section { display: flex; flex-direction: column; gap: 10px; }
    .export-warning {
      background: #fef3c7; color: #92400e; padding: 10px 14px;
      border-radius: 7px; font-size: 13px;
    }
    .btn-back { background: none; border: none; color: var(--primary); cursor: pointer;
                font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>LEO Eval Admin</h1>
    <p>Progress Dashboard · Expert Evaluation Console</p>
  </div>

  <!-- Login section (shown initially) -->
  <div class="card" id="login-section">
    <h2>Admin Access</h2>
    <div class="login-form">
      <input class="pw-input" type="password" id="admin-password"
             placeholder="Enter admin password" autocomplete="off">
      <button class="btn btn-primary" id="login-btn" onclick="adminLogin()">View Progress</button>
      <div class="error-box" id="error-box"></div>
    </div>
  </div>

  <!-- Progress section (shown after auth) -->
  <div class="card" id="progress-section" style="display:none">
    <h2>Reviewer Progress</h2>
    <div class="reviewer-card" id="progress-content">
      <p style="color:var(--muted);font-size:13px;">Loading…</p>
    </div>
  </div>

  <!-- Export section (shown after auth) -->
  <div class="card" id="export-section" style="display:none">
    <h2>Export Ratings</h2>
    <div class="export-section">
      <p class="export-warning" id="export-warning"></p>
      <button class="btn btn-success" id="export-btn" onclick="exportCSV()">
        ⬇ Download merged_ratings.csv
      </button>
    </div>
  </div>

  <button class="btn-back" onclick="window.location.href='/'">← Back to Login</button>
</div>

<script src="/js/api.js"></script>
<script>
  let _adminPassword = '';

  async function adminLogin() {
    _adminPassword = document.getElementById('admin-password').value;
    const errorEl = document.getElementById('error-box');
    const btn = document.getElementById('login-btn');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Loading…';

    try {
      const data = await API.adminGet('/api/progress/admin', _adminPassword);
      renderProgress(data);
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('progress-section').style.display = 'block';
      document.getElementById('export-section').style.display = 'block';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'View Progress';
    }
  }

  function renderProgress(data) {
    const total = data.total;
    const r1 = data.reviewer_1;
    const r2 = data.reviewer_2;

    function pct(n, t) { return t ? Math.round(n / t * 100) : 0; }

    const completeBadge = (n, t) =>
      n >= t ? '<span class="complete-badge">✓ Complete</span>' : '';

    document.getElementById('progress-content').innerHTML = `
      <div class="reviewer-row">
        <span class="reviewer-name">Reviewer 1</span>
        ${completeBadge(r1.completed, total)}
        <span class="reviewer-pct">${r1.completed} / ${total} (${pct(r1.completed, total)}%)</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill prog-fill-1" style="width:${pct(r1.completed, total)}%"></div>
      </div>
      <div class="divider"></div>
      <div class="reviewer-row">
        <span class="reviewer-name">Reviewer 2</span>
        ${completeBadge(r2.completed, total)}
        <span class="reviewer-pct">${r2.completed} / ${total} (${pct(r2.completed, total)}%)</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill prog-fill-2" style="width:${pct(r2.completed, total)}%"></div>
      </div>`;

    const bothComplete = r1.completed >= total && r2.completed >= total;
    const warningEl = document.getElementById('export-warning');
    const exportBtn = document.getElementById('export-btn');
    if (bothComplete) {
      warningEl.style.display = 'none';
      exportBtn.disabled = false;
    } else {
      warningEl.textContent =
        `Both reviewers must complete all ${total} ratings before the unblinded export is available.` +
        ` Current: R1=${r1.completed}/${total}, R2=${r2.completed}/${total}.`;
      warningEl.style.display = 'block';
      exportBtn.disabled = false;  // allow partial export for progress checks
      exportBtn.textContent = '⬇ Download partial export';
    }
  }

  async function exportCSV() {
    const btn = document.getElementById('export-btn');
    btn.disabled = true;
    btn.textContent = 'Generating…';
    try {
      const blob = await API.adminGetCsv('/api/export/csv', _adminPassword);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'merged_ratings.csv';
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Export failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '⬇ Download merged_ratings.csv';
    }
  }

  // Allow Enter key on password field
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('admin-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') adminLogin();
    });
  });
</script>
</body>
</html>
