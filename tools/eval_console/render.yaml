services:
  - type: web
    name: leo-eval-console
    runtime: python
    rootDir: tools/eval_console
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard (see DEPLOYMENT.md §3)
      - key: SUPABASE_KEY
        sync: false
      - key: REVIEWER_1_PASSWORD
        sync: false
      - key: REVIEWER_2_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
