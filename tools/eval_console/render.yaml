services:
  - type: web
    name: leo-eval-console
    runtime: python
    rootDir: tools/eval_console
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    disk:
      name: ratings-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/ratings.db
      - key: REVIEWER_1_PASSWORD
        sync: false   # set manually in Render dashboard
      - key: REVIEWER_2_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
