[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-backend"
version = "0.1.0"
description = "Philippine Labor Law Chatbot Backend API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "LEO Team"}
]
keywords = ["chatbot", "labor-law", "philippines", "rag", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Pydantic & Settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # OpenAI
    "openai>=1.10.0",
    
    # Supabase & Database
    "supabase>=2.3.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    
    # LangChain (for memory management)
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    
    # Google Cloud (Optional - Translation & Maps)
    "google-cloud-translate>=3.14.0",
    "googlemaps>=4.10.0",
    
    # NLP & ML
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "fasttext-wheel>=0.9.2",
    "tiktoken>=0.5.2",
    
    # Security & Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    
    # HTTP & Networking
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    
    # Utilities
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    
    # Code Quality
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    
    # Type Stubs
    "types-python-jose>=3.3.4",
    "types-passlib>=1.7.7",
    "types-python-dateutil>=2.8.19",
]

redis = [
    # Optional Redis support for rate limiting & caching
    "redis>=5.0.0",
    "aioredis>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/leo-backend"
Repository = "https://github.com/yourusername/leo-backend"
Issues = "https://github.com/yourusername/leo-backend/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "app*", "core*", "services*", "adapters*", "nlp*", "kb*", "retrieval*", "utils*"]
exclude = ["tests*", "docs*", "infra*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "langchain.*",
    "transformers.*",
    "torch.*",
    "fasttext.*",
    "google.cloud.*",
    "googlemaps.*",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100
